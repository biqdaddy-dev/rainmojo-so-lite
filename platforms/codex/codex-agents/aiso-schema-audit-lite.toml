description = "ตรวจ structured data (JSON-LD) ที่มีอยู่แล้วบนเว็บไซต์ แล้วสร้างส่วนที่ขาดให้พร้อมวาง ใช้เมื่อผู้ใช้อยากรู้ว่าเว็บมี schema ครบไหม หรืออยากได้ JSON-LD ที่ช่วยให้ระบบ AI เข้าใจตัวตนของเว็บ (รุ่น Lite สำหรับเวิร์กช็อป)"
