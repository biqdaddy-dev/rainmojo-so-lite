name = "aiso-ai-visibility-lite"
description = "ใช้เมื่อต้องการตรวจ AI visibility ของเว็บหรือ URL เดียวแบบต่อเนื่องอัตโนมัติ ตั้งแต่การเข้าถึงของ AI crawler, llms.txt, ความพร้อมของย่อหน้าที่จะถูกอ้างอิง ไปจนถึงการถูกพูดถึงนอกเว็บ แล้วรวมผลเป็นรายงานเดียวด้วย report-lite และปิดท้ายด้วย compare เมื่อมีข้อมูลสองรอบ ประเมินเชิงคุณภาพ ไม่มีคะแนนตัวเลข (รุ่น Lite สำหรับเวิร์กช็อป)"
