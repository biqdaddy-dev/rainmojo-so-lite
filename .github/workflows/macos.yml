name: macOS

# The shared image spec module is byte-identical in rainmojo-so, rainmojo-so-lite
# and rangsarn, and the owner asked for it to be tested on macOS (2026-10-27).
# This repository is public, so GitHub-hosted runners cost nothing here, unlike
# the private repositories, which run on the owner's self-hosted Linux runners.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: contract test, pipeline selftest, regression on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test dependency
        run: python -m pip install "Pillow>=12.3,<13"
      - name: Platform
        run: python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
      - name: Image spec contract test
        run: python skills/rainmojo-so-lite/scripts/image_spec_contract_test.py
      - name: Content pipeline selftest
        run: python skills/rainmojo-so-lite/scripts/content_pipeline_selftest.py
      - name: Regression
        run: python skills/rainmojo-so-lite/scripts/regression.py
